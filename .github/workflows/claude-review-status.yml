name: Refresh Claude Review status

on:
  pull_request:
    types: [synchronize, edited]
  push:
    branches: ["**"]

permissions: {}

jobs:
  status:
    if: >-
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/') && github.event.deleted == false) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'synchronize' ||
      (github.event.action == 'edited' && github.event.changes.base.ref.from != '')))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: JBallin/claude-review-runtime/.github/workflows/claude-review-status.yml@396f9f74195fe7df2b3081dca3d1550f2fb2e574
