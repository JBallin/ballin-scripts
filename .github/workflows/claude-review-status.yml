name: Refresh Claude Review status

on:
  pull_request:
    types: [synchronize, edited]

permissions: {}

jobs:
  status:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'synchronize' ||
      (github.event.action == 'edited' && github.event.changes.base.ref.from != ''))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: JBallin/claude-review-runtime/.github/workflows/claude-review-status.yml@a0f81933a3272c362ed40f99020c59defb410c86
