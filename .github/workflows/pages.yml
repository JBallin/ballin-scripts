name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/CONTRIBUTING.md
      - .github/SUPPORT.md
      - .github/SECURITY.md
      - LICENSE.md
      - 'docs/**'
      - 'site/**'
      - 'tools/site/**'
      - .nvmrc
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole build/deploy transaction. Even an older queued event builds
# current main, never the historical event SHA. An active deploy is not canceled.
concurrency:
  group: ballin-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'JBallin/ballin-scripts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Record complete snapshot source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site renderer
        run: npm ci --prefix site --ignore-scripts
      - name: Build current docs and the explicitly pinned bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/site/site.py build --analytics
      - name: Upload complete Pages snapshot
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .site-output/site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current publication inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a superseded snapshot
        env:
          SITE_SOURCE: ${{ needs.build.outputs.source }}
        run: |
          git diff --exit-code "$SITE_SOURCE" HEAD -- \
            README.md .github/CONTRIBUTING.md .github/SUPPORT.md .github/SECURITY.md LICENSE.md \
            docs site tools/site .nvmrc .github/workflows/pages.yml
      - name: Deploy complete snapshot
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
