name: Manual Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  eligibility:
    # Fetch PR state with read access before invoking the runtime.
    if: >-
      contains(fromJSON('["/claude-review","/claude-review opus","/claude-review effort low","/claude-review effort medium","/claude-review effort high","/claude-review effort xhigh","/claude-review effort max","/claude-review opus effort low","/claude-review opus effort medium","/claude-review opus effort high","/claude-review opus effort xhigh","/claude-review opus effort max"]'), github.event.comment.body) &&
      github.event.comment.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Install GNU timeout
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnu-coreutils
          dpkg-query --show gnu-coreutils
          /usr/bin/gnutimeout --version

      - name: Check PR eligibility
        id: eligibility
        env:
          GNU_TIMEOUT: /usr/bin/gnutimeout
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          timeout_version=$("$GNU_TIMEOUT" --version)
          [[ "$timeout_version" == *'GNU coreutils'* ]] || exit 1
          pr=$("$GNU_TIMEOUT" 30s gh api "repos/$REPO/pulls/$PR_NUMBER")
          eligible=$(printf '%s' "$pr" | jq -er --arg repo "$REPO" --argjson number "$PR_NUMBER" '
            if type != "object" then error("Invalid PR response")
            elif (.number | type) != "number" or .number != $number
              then error("Unexpected PR number")
            else
              .state == "open" and .draft == false and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo
            end | tostring')
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"

  review:
    needs: eligibility
    # Eligibility is checked before joining the runtime's per-PR queue.
    if: >-
      needs.eligibility.outputs.eligible == 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: JBallin/claude-review-runtime/.github/workflows/claude.yml@fdb26f96afb3ffbee64186561a15b8e9c3f41919
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
