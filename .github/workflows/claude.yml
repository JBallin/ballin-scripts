name: Claude

# Responds to @claude in pull request comments. Deliberately review-only:
# contents are read-only and tools are restricted, so Claude comments but does
# not push changes. Widen both here if @claude should ever implement fixes.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    name: Respond
    # Only trusted commenters start a run, so anyone else's @claude never
    # occupies a runner (the action also requires write access). This keeps the
    # workflow safe to reuse in a public repository.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' ||
      github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Respond to @claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
