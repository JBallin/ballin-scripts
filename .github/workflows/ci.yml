name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check Bash syntax
        shell: bash
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            first_line=$(head -n 1 -- "$file")
            if [[ "$first_line" =~ ^#!.*bash([[:space:]]|$) ]]; then
              bash -n "./$file"
            fi
          done

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zsh jq gnu-coreutils
          dpkg-query --show gnu-coreutils
          /usr/bin/gnutimeout --version

      - name: Run ShellCheck
        shell: bash
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            first_line=$(head -n 1 -- "$file")
            if [[ "$first_line" =~ ^#!.*bash([[:space:]]|$) ]]; then
              shellcheck "./$file"
            fi
          done

      - name: Run actionlint
        run: docker run --rm -v "${PWD}:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Report runner and tool versions
        run: |
          printf 'Runner image: %s (%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          cat /etc/os-release
          node --max-old-space-size=6144 -e 'const os = require("node:os"), v8 = require("node:v8"); const mib = value => Math.round(value / 2 ** 20); console.log(JSON.stringify({memoryMiB: {total: mib(os.totalmem()), free: mib(os.freemem()), constrained: mib(process.constrainedMemory()), available: mib(process.availableMemory()), reporterHeapLimit: mib(v8.getHeapStatistics().heap_size_limit)}}));'
          for tool in bash jq /usr/bin/gnutimeout shellcheck zsh docker node npm; do
            command -v "$tool"
            "$tool" --version
          done

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck analytics worker
        run: npm run typecheck:analytics-worker

      - name: Test Claude preflight with Bash and jq
        env:
          GNU_TIMEOUT: /usr/bin/gnutimeout
        run: npm run test:claude-preflight

      - name: Check release consistency
        run: npm run release:check

      - name: Run unit tests with coverage
        id: coverage
        run: npm run test:coverage

      - name: Capture coverage comparison evidence
        id: coverage_diagnostics
        if: >-
          ${{ !cancelled() &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) &&
            hashFiles('coverage/tmp/coverage-*.json') != '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          fs.writeFileSync('coverage/runtime.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            lockSha256: createHash('sha256').update(fs.readFileSync('package-lock.json')).digest('hex'),
            node: process.version,
            v8: process.versions.v8,
            platform: process.platform,
            arch: process.arch,
            uid: process.getuid(),
            c8: require('c8/package.json').version,
            mocha: require('mocha/package.json').version,
          }, null, 2) + '\n');
          NODE
          node --max-old-space-size=6144 test/coverage.ts report --check-coverage=false --temp-directory=coverage/tmp --reporter=json --reporter=json-summary

      - name: Upload coverage comparison evidence
        if: >-
          ${{ !cancelled() &&
            steps.coverage_diagnostics.outcome == 'success' &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/runtime.json
            coverage/coverage-final.json
            coverage/coverage-summary.json
          retention-days: 7

      - name: Package raw V8 coverage evidence
        id: raw_coverage_archive
        if: >-
          ${{ !cancelled() &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) &&
            hashFiles('coverage/tmp/coverage-*.json') != '' }}
        run: |
          set -o pipefail
          TIMEFORMAT='Archive packaging: %3R seconds'
          time { tar -cf - -C coverage tmp | gzip -1 > coverage/coverage-raw.tar.gz; }

      - name: Upload raw V8 coverage evidence
        id: raw_coverage_upload
        if: >-
          ${{ !cancelled() &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) &&
            steps.raw_coverage_archive.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/coverage-raw.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Download raw V8 coverage evidence
        id: raw_coverage_download
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
            steps.raw_coverage_upload.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw-coverage-roundtrip/download

      - name: Verify raw V8 coverage artifact round trip
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
            steps.raw_coverage_download.outcome == 'success' }}
        env:
          ROUNDTRIP_ROOT: ${{ runner.temp }}/raw-coverage-roundtrip
        run: |
          set -euo pipefail
          cmp coverage/coverage-raw.tar.gz "$ROUNDTRIP_ROOT/download/coverage-raw.tar.gz"
          mkdir "$ROUNDTRIP_ROOT/extracted"
          TIMEFORMAT='Archive extraction: %3R seconds'
          time tar -xzf "$ROUNDTRIP_ROOT/download/coverage-raw.tar.gz" -C "$ROUNDTRIP_ROOT/extracted"
          TIMEFORMAT='Content comparison: %3R seconds'
          time diff -r coverage/tmp "$ROUNDTRIP_ROOT/extracted/tmp"
          printf 'Raw coverage files: '
          find coverage/tmp -type f -print | wc -l
          du -sk coverage/tmp
          wc -c coverage/coverage-raw.tar.gz

  minimum-node:
    name: Minimum Node.js runtime
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up minimum Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.12.0'

      - name: Smoke test minimum runtime
        run: node test/ci/minimum_node_smoke.ts
