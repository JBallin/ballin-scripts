name: CI
on:
  workflow_dispatch:
    inputs:
      reviewed_driver_sha:
        description: Exact diagnostic commit approved for this one dispatch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: experiment-319-coverage-identity
  cancel-in-progress: false
jobs:
  coverage-identity:
    if: github.actor == 'JBallin' && github.ref == 'refs/heads/experiment/319-coverage-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 1
        with:
          path: driver
          persist-credentials: false
      - name: Check out immutable source for locked dependencies and pure module provenance
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 1
        with:
          ref: f6759244d12f3f6eac2141f4c8b6da90887acded
          path: source
          persist-credentials: false
      - name: Collect four bounded coverage identity cells
        env:
          DIAGNOSTIC_319_REVIEWED_DRIVER_SHA: ${{ inputs.reviewed_driver_sha }}
        run: python3 driver/.github/experiments/319-coverage-identity/measure.py "$GITHUB_WORKSPACE/source"
