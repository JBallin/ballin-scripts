name: CI
on:
  workflow_dispatch:
    inputs:
      reviewed_driver_sha:
        description: Exact qualification driver commit approved for this dispatch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: experiment-319-c8-qualification
  cancel-in-progress: false
jobs:
  c8-qualification:
    if: github.actor == 'JBallin' && github.ref == 'refs/heads/experiment/319-c8-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Start the bounded preparation clock
        run: printf 'BENCH_319_JOB_STARTED_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out measurement driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
        with:
          path: driver
          persist-credentials: false
      - name: Check out immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
        with:
          ref: 2951bb1a7ff9696f2c4b302ae6768fb9ad974475
          path: source
          persist-credentials: false
      - name: Set up the older diagnostic runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 5
        with:
          node-version: '24.15.0'
          check-latest: false
      - name: Record the older runtime root
        run: |
          node -e 'process.stdout.write("BENCH_319_NODE2415_ROOT=" + require("node:path").dirname(require("node:path").dirname(process.execPath)) + "\n")' >> "$GITHUB_ENV"
      - name: Set up the comparison runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 5
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Record the comparison runtime root
        run: |
          node -e 'process.stdout.write("BENCH_319_NODE24_ROOT=" + require("node:path").dirname(require("node:path").dirname(process.execPath)) + "\n")' >> "$GITHUB_ENV"
      - name: Install existing shell prerequisites
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh shellcheck
      - name: Install locked source dependencies
        timeout-minutes: 10
        working-directory: source
        run: npm ci
      - name: Prepare the owned quota fixture image
        timeout-minutes: 10
        run: >-
          docker build --platform linux/amd64 --build-arg "BENCH_UID=$(id -u)"
          --build-arg "BENCH_GID=$(id -g)" --tag ballin-319-quota:reviewed
          driver/.github/experiments/319-adaptive
      - name: Run the bounded corrected qualification
        env:
          BENCH_319_REVIEWED_DRIVER_SHA: ${{ inputs.reviewed_driver_sha }}
        run: python3 driver/.github/experiments/319-adaptive/measure.py "$GITHUB_WORKSPACE/source"
      - name: Retain raw profiles from every terminated sample
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/319-c8-qualification/**/raw-profiles.tar.gz
            ${{ runner.temp }}/319-c8-qualification/**/raw-manifest.json
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
