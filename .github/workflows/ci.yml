name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check Bash syntax
        run: |
          git grep -Ilz '^#!.*bash' -- . \
            | xargs -0 -r -n1 bash -n

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zsh

      - name: Run ShellCheck
        run: |
          git grep -Ilz '^#!.*bash' -- . \
            | xargs -0 -r shellcheck

      - name: Run actionlint
        run: docker run --rm -v "${PWD}:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color -ignore 'label "ubuntu-26[.]04" is unknown' .github/workflows/*.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck analytics worker
        run: npm run typecheck:analytics-worker

      - name: Run unit tests with coverage
        id: coverage
        run: npm run test:coverage

      - name: Capture coverage comparison evidence
        id: coverage_diagnostics
        if: >-
          ${{ !cancelled() &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          fs.writeFileSync('coverage/runtime.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            lockSha256: createHash('sha256').update(fs.readFileSync('package-lock.json')).digest('hex'),
            node: process.version,
            v8: process.versions.v8,
            platform: process.platform,
            arch: process.arch,
            uid: process.getuid(),
            c8: require('c8/package.json').version,
            mocha: require('mocha/package.json').version,
          }, null, 2) + '\n');
          NODE
          node node_modules/c8/bin/c8.js report --check-coverage=false --temp-directory=coverage/tmp --reporter=json --reporter=json-summary

      - name: Upload coverage comparison evidence
        if: >-
          ${{ !cancelled() &&
            steps.coverage_diagnostics.outcome == 'success' &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/runtime.json
            coverage/coverage-final.json
            coverage/coverage-summary.json
          retention-days: 7

      - name: Upload raw V8 coverage evidence
        if: ${{ !cancelled() && steps.coverage.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/tmp/
          retention-days: 7

  # PR-only, credential-free predeployment coverage. The OS label is temporarily
  # ubuntu-26.04 for #403; restore ubuntu-latest once validated.
  analytics-worker-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Create isolated Wrangler config
        working-directory: analytics-worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const template = fs.readFileSync('wrangler.toml.example', 'utf8');
          const placeholder = 'replace-with-cloudflare-d1-database-id';
          if (template.split(placeholder).length !== 2) {
            throw new Error('Expected exactly one D1 database ID placeholder');
          }
          fs.writeFileSync(
            'wrangler.toml',
            template.replace(placeholder, '00000000-0000-4000-8000-000000000000'),
          );
          NODE

      - name: Bundle analytics Worker without deploying
        working-directory: analytics-worker
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes 'wrangler@^4.36.0' --version
          npx --yes 'wrangler@^4.36.0' deploy --dry-run --config wrangler.toml --outdir "$RUNNER_TEMP/analytics-worker-bundle"
          test -n "$(find "$RUNNER_TEMP/analytics-worker-bundle" -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)"
