name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experiment-319-two-cpu-evidence
  cancel-in-progress: false
jobs:
  two-cpu-evidence:
    if: github.actor == 'JBallin' && github.ref == 'refs/heads/experiment/319-two-cpu-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out measurement driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: driver
          persist-credentials: false
      - name: Check out immutable PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: c9f0a9c2c6bd73841246303ae75056aceffdb3d5
          path: source
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Install existing shell prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh shellcheck
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Compare serial and two workers on two CPUs
        run: python3 driver/.github/experiments/319-two-cpu/measure.py "$GITHUB_WORKSPACE/source"
