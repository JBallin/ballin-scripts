name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experiment-319-adaptive-evidence
  cancel-in-progress: false
jobs:
  adaptive-evidence:
    if: github.actor == 'JBallin' && github.ref == 'refs/heads/experiment/319-adaptive-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Start the bounded preparation clock
        run: printf 'BENCH_319_JOB_STARTED_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out measurement driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
        with:
          path: driver
          persist-credentials: false
      - name: Check out immutable candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 5
        with:
          ref: f6759244d12f3f6eac2141f4c8b6da90887acded
          path: source
          persist-credentials: false
      - name: Set up the older diagnostic runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 5
        with:
          node-version: '24.15.0'
          check-latest: false
      - name: Record the older runtime root
        run: |
          node -e 'process.stdout.write("BENCH_319_NODE2415_ROOT=" + require("node:path").dirname(require("node:path").dirname(process.execPath)) + "\n")' >> "$GITHUB_ENV"
      - name: Set up the comparison runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        timeout-minutes: 5
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Record the comparison runtime root
        run: |
          node -e 'process.stdout.write("BENCH_319_NODE24_ROOT=" + require("node:path").dirname(require("node:path").dirname(process.execPath)) + "\n")' >> "$GITHUB_ENV"
      - name: Install existing shell prerequisites
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh shellcheck
      - name: Install locked source dependencies
        timeout-minutes: 10
        working-directory: source
        run: npm ci
      - name: Prepare the owned quota fixture image
        timeout-minutes: 10
        run: >-
          docker build --platform linux/amd64 --build-arg "BENCH_UID=$(id -u)"
          --build-arg "BENCH_GID=$(id -g)" --tag ballin-319-quota:reviewed
          driver/.github/experiments/319-adaptive
      - name: Run the bounded adaptive comparison
        run: python3 driver/.github/experiments/319-adaptive/measure.py "$GITHUB_WORKSPACE/source"
