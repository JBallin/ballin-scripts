name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ordering_comparison:
        description: Compare frozen two-worker test queue ordering
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.ordering_comparison }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check Bash syntax
        run: |
          git grep -Ilz '^#!.*bash' -- . \
            | xargs -0 -r -n1 bash -n

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zsh jq coreutils

      - name: Run ShellCheck
        run: |
          git grep -Ilz '^#!.*bash' -- . \
            | xargs -0 -r shellcheck

      - name: Run actionlint
        run: docker run --rm -v "${PWD}:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck analytics worker
        run: npm run typecheck:analytics-worker

      - name: Test Claude preflight with Bash and jq
        run: npm run test:claude-preflight

      - name: Run unit tests with coverage
        id: coverage
        run: npm run test:coverage

      - name: Capture coverage comparison evidence
        id: coverage_diagnostics
        if: >-
          ${{ !cancelled() &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) &&
            hashFiles('coverage/tmp/coverage-*.json') != '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          fs.writeFileSync('coverage/runtime.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            lockSha256: createHash('sha256').update(fs.readFileSync('package-lock.json')).digest('hex'),
            node: process.version,
            v8: process.versions.v8,
            platform: process.platform,
            arch: process.arch,
            uid: process.getuid(),
            c8: require('c8/package.json').version,
            mocha: require('mocha/package.json').version,
          }, null, 2) + '\n');
          NODE
          node --max-old-space-size=6144 test/coverage.ts report --check-coverage=false --temp-directory=coverage/tmp --reporter=json --reporter=json-summary

      - name: Upload coverage comparison evidence
        if: >-
          ${{ !cancelled() &&
            steps.coverage_diagnostics.outcome == 'success' &&
            (steps.coverage.outcome == 'failure' ||
              (github.event_name == 'workflow_dispatch' &&
                steps.coverage.outcome == 'success')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/runtime.json
            coverage/coverage-final.json
            coverage/coverage-summary.json
          retention-days: 7

      - name: Upload raw V8 coverage evidence
        if: >-
          ${{ !cancelled() &&
            steps.coverage.outcome == 'failure' &&
            hashFiles('coverage/tmp/coverage-*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/tmp/
          retention-days: 7

  ordering_comparison:
    if: ${{ inputs.ordering_comparison }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: issue-569-ordering-comparison
      cancel-in-progress: false
    env:
      PERF_SOURCE: ${{ github.workspace }}/benchmark-source
    steps:
      - name: Configure evidence directory
        run: echo "PERF_EVIDENCE=$RUNNER_TEMP/ordering-comparison" >> "$GITHUB_ENV"
      - name: Check out experiment harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out frozen baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a912440e8564eaa6080f8b1d551e463254b993f8
          path: benchmark-source
          persist-credentials: false
      - name: Install matching shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zsh jq coreutils
      - name: Set up fixed Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: benchmark-source/package-lock.json
      - name: Install frozen dependencies
        working-directory: benchmark-source
        run: npm ci
      - name: Validate workflow and unchanged shell surfaces
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          git grep -Ilz '^#!.*bash' -- . | xargs -0 -r -n1 bash -n
          git grep -Ilz '^#!.*bash' -- . | xargs -0 -r shellcheck
          docker run --rm -v "${PWD}:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml
      - name: Record baseline and matched test manifest
        run: node .github/benchmarks/ordering/prepare.js control
      - name: Validate baseline Node and preflight gates
        working-directory: benchmark-source
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:analytics-worker
          npm run test:claude-preflight
      - name: Run baseline with two workers and coverage
        id: control
        continue-on-error: true
        run: python3 .github/benchmarks/ordering/run.py control
      - name: Record candidate and validate matched controls
        run: node .github/benchmarks/ordering/prepare.js candidate
      - name: Run candidate with two workers and coverage
        id: candidate
        continue-on-error: true
        run: python3 .github/benchmarks/ordering/run.py candidate
      - name: Compare test outcomes, ordering and reports
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' && steps.candidate.outcome != 'skipped' }}
        run: python3 .github/benchmarks/ordering/compare.py
      - name: Compare effective raw V8 coverage
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' && steps.candidate.outcome != 'skipped' }}
        run: node .github/benchmarks/ordering/effective-v8.js
      - name: Require successful coverage commands
        if: ${{ !cancelled() && (steps.control.outcome != 'success' || steps.candidate.outcome != 'success') }}
        run: exit 1
      - name: Package retained evidence
        if: ${{ always() }}
        run: |
          if [ -d "$PERF_EVIDENCE" ]; then
            tar -czf "$RUNNER_TEMP/ordering-comparison.tar.gz" -C "$RUNNER_TEMP" ordering-comparison
            sha256sum "$RUNNER_TEMP/ordering-comparison.tar.gz" > "$RUNNER_TEMP/ordering-comparison.sha256"
          fi
      - name: Upload retained evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ordering-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ordering-comparison.tar.gz
            ${{ runner.temp }}/ordering-comparison.sha256
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
